name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sunbird
          POSTGRES_PASSWORD: sunbird
          POSTGRES_DB: sunbird_db
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+psycopg2://sunbird:sunbird@localhost:5432/sunbird_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: alembic -c alembic.ini upgrade head

      - run: pytest

  build-and-push:
    runs-on: ubuntu-latest

    needs: test

    if: github.ref == 'refs/heads/main'  # only deploy on main

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/location-collision-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/location-collision-backend:latest