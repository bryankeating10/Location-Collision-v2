name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sunbird
          POSTGRES_PASSWORD: sunbird
          POSTGRES_DB: sunbird_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sunbird"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://sunbird:sunbird@localhost:5432/sunbird_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U sunbird; do
            sleep 1
          done

      - name: Run Alembic migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests
        run: pytest